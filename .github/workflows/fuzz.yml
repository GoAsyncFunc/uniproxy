name: Fuzz

on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzNodeHandlersParseConfig
          - FuzzNormalizeRouteMatch
          - FuzzDNSMatches
          - FuzzValidateCommonNode
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25.11'

      - name: Download modules
        run: go mod download

      - name: Run fuzz target
        run: go test ./pkg -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s
